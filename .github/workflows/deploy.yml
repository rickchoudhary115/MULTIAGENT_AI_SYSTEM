name: Kivo AI Deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  # ECR Public registry alias (from the ECR Public console)
  REGISTRY_ALIAS: z8g7l2l8

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR Public auth only works in us-east-1, so AWS_REGION must be us-east-1
      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push images
        run: |
          set -euo pipefail
          REGISTRY="public.ecr.aws/$REGISTRY_ALIAS"

          build_push() {
            repo="$1"
            dockerfile="$2"
            docker build -f "$dockerfile" \
              -t "$REGISTRY/$repo:latest" \
              -t "$REGISTRY/$repo:${GITHUB_SHA}" \
              backend
            docker push --all-tags "$REGISTRY/$repo"
          }

          # File names are case-sensitive on Linux: check DockerFile vs Dockerfile
          build_push gateway         backend/gateway/DockerFile
          build_push auth-service    backend/services/auth/DockerFile
          build_push chat-service    backend/services/chat/DockerFile
          build_push agent-service   backend/services/agent/DockerFile
          build_push billing-service backend/services/billing/DockerFile

      - name: Deploy ECS services
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
        run: |
          set -euo pipefail
          SERVICES="${{ secrets.GATEWAY_SERVICE }} ${{ secrets.AUTH_SERVICE }} ${{ secrets.CHAT_SERVICE }} ${{ secrets.AGENT_SERVICE }} ${{ secrets.BILLING_SERVICE }}"

          for svc in $SERVICES; do
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$svc" \
              --force-new-deployment > /dev/null
          done

          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICES

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build frontend
        working-directory: frontend
        # Add build-time variables here if the app needs them, e.g.:
        # env:
        #   VITE_API_URL: /api
        #   VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync frontend/dist s3://${{ secrets.S3_BUCKET }} --delete

      # CLOUDFRONT_DISTRIBUTION_ID must be the FRONTEND distribution (E2FI4X2VICVZ5E)
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"